name: Legacy research data audit

on:
  pull_request:
    paths:
      - "research/**"
      - ".github/workflows/legacy-research-audit.yml"
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline auditor tests
        run: python -m unittest discover -s research/tests -v
      - name: Inventory only public research price files
        run: python research/audit_legacy_sources.py --root . --output "$RUNNER_TEMP/nextjs-research-inventory.json"
      - name: Upload provenance inventory
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-research-price-inventory
          path: ${{ runner.temp }}/nextjs-research-inventory.json
          if-no-files-found: error
          retention-days: 7
