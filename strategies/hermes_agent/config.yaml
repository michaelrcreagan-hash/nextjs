# CBT Framework Configuration
# Strategy: hermes_agent
# Last updated: 2026-08-26 via /cbt:config
#
# These values are NOT framework defaults. Every risk-relevant setting below
# was changed from the template because the template contradicted a finding in
# DISCOVERY.md, EDA.md, or RESEARCH.md. Each change carries its justification
# inline. See "What changed and why" at the bottom of this file for the summary.

account:
  # Identified real capital as of 2026-08-26 (updated at /cbt:config round 2):
  #   Merrill IRA (equities/ETFs, 69 positions) ...... $ 9,860
  #   Coinbase spot #1 (20 tokens) ................... $19,846
  #   Coinbase spot #2 ("coinbase2") ................. $25,000
  #   Crypto perps (Hyperliquid) ..................... $26,000
  #   Fidelity (Z34628250 Joint WROS) ................ $18,996  <- ADDED 2026-08-27
  #   IDENTIFIED TOTAL ............................... $99,702
  #
  # Fidelity is now quantified from Portfolio_Positions_Aug232026.xlsx and is
  # the one VERIFIED figure here (confirmed two ways -- see FIDELITY_SLEEVES.md).
  # It closes the gap to the $100,000 this session's $1.5M-by-2029 goal math
  # assumed to just $298, so that assumption was sound.
  #
  # initial_capital BELOW IS NOW STALE at 80,000 -- it understates the book by
  # ~$20k. Deliberately NOT bumped yet: the other four account figures still
  # carry the author's "my calculation was incorrect" flag, and re-running the
  # baseline against a number that is 4/5 unverified would replace one wrong
  # figure with another. Bump to 99,702 (or the corrected total) and re-run
  # BUILD_PLAN step 5 once those four are confirmed.
  #
  # NOTE ALSO: the live Fidelity book runs 1.45x gross-to-net on margin, which
  # contradicts leverage.enabled:false below. That is a live position, not a
  # backtest setting, but the two should be reconciled deliberately.
  initial_capital: 80000
  currency: USD

# Computing engine
engine:
  type: fast  # pandas | fast (Polars + NumPy + Numba)

sizing:
  mode: percent  # percent | fixed | kelly
  # CONCENTRATION -- determined at user request rather than chosen by them.
  # At $80k the capacity floor is no longer the binding constraint (12
  # positions still gives $5,360 each, 5.4x the floor), so this reverts to a
  # diversification-vs-signal-quality question. The repo's own evidence
  # CONFLICTS on it:
  #   - trading/hedgefund/REPORT.md  : top_n 12 > 8 > 5 (momentum desk)
  #   - four_sleeve OPTIMIZATION_...  : top 4 > top 6 (innovation sleeve)
  # 10 sits between them and makes 8% x 10 = 80% max deployed, which lines up
  # exactly with macro_sector_dominance's RISK_ON gross_exposure_pct of 80.
  # Treated as a DEFAULT, not a determination -- the real answer is the
  # pre-registered grid below, resolved at /cbt:optimize.
  percent_per_trade: 8.0
  fixed_amount: null
  max_positions: 10
  optimize_ranges:
    max_positions: [5, 7, 10, 12]      # spans both conflicting in-repo findings
    percent_per_trade: [6.7, 8.0, 11.4, 16.0]  # paired to hold ~80% deployed
  # CAPACITY GUARD -- the most concrete finding in RESEARCH.md. The live
  # Merrill book holds 69 positions averaging ~$143 each; Barber & Odean
  # (2000) measured a 6.5pp/yr drag on the most-active retail cohort with
  # gross returns nearly identical across activity levels -- the entire gap
  # was costs. Non-binding at $80k, but retained: it must bind if equity ever
  # falls, and it is what stops the strategy from recreating the 69-position
  # book. Any signal that would size below it is SKIPPED, never scaled down.
  min_position_value_usd: 1000

# CASH POSITION -- determined at user request.
# Deliberately NOT a fixed buffer. Cash is the residual of regime-scaled gross
# exposure, so it expands exactly when the regime engine says risk is rising.
# Values taken from macro_sector_dominance's regime_score_model (already in
# this repo) rather than invented. four_sleeve's realized average cash weight
# under an equivalent matrix was 21.9% / 23.9% across its two eras, which is
# the ballpark to expect here.
regime_gross_exposure:
  RISK_ON: 80    # -> 20% cash
  MIXED: 50      # -> 50% cash
  CAUTION: 25    # -> 75% cash
  RISK_OFF: 0    # -> 100% cash (hermes_agent has no income sleeve to rotate into)
  source: strategies/macro_sector_dominance  # regime_score_model.regime_labels

leverage:
  # Template shipped 5x default / 20x max. Disabled deliberately for the
  # baseline: RESEARCH.md finds the evidenced benefit of this strategy's core
  # mechanism is DRAWDOWN REDUCTION, not Sharpe improvement (Moreira-Muir 2017
  # vs Cederburg et al. 2020) -- leveraging into that is backwards, and the
  # book includes a retirement account.
  # NOTE: this disables account-level margin borrowing only. Leveraged
  # instruments the user actually holds (SOXL, TQQQ) still carry their
  # embedded leverage through their own price series, and the Hyperliquid
  # perps sleeve is a separately-scoped extension, not part of this baseline.
  enabled: false
  default: 1
  max: 1

risk:
  stop_loss:
    enabled: true
    # ATR-based, not the template's flat 1.0%. 3.0x ATR matches the initial
    # stop already validated in this repo's hedgefund engine (see
    # trading/hedgefund/REPORT.md round-3 findings: 3.0 ATR >= 2.5 > 2.0).
    # CAVEAT: price data here is close-only, so ATR is a close-to-close proxy
    # -- stops will be slightly tighter than true-range ATR would give. Same
    # documented limitation as the rest of this repo.
    mode: atr  # percent | atr | fixed
    percent: null
    atr_multiplier: 3.0
    fixed_value: null
  take_profit:
    # ENABLED as a PARTIAL scale-out at 1R, per the user's stated design:
    # "take profit at 100% risk reward to reduce risk, then set a take profit
    # with a trailing stop loss".
    #
    # This reverses the previous /cbt:config round, which disabled take-profit
    # outright. That reasoning still holds for a FULL fixed target -- it would
    # cap the right-tail continuations the trailing mechanism depends on. A
    # PARTIAL scale-out is a different animal: it books risk off the table
    # while the runner keeps riding the trail, so the tail is not capped.
    #
    # In-repo support: trading/hedgefund/REPORT.md's scale-in variant moved
    # profit factor 1.74 -> 3.65, the largest PF lever found anywhere in this
    # repo. See the tradeoff warning under scale_out below.
    enabled: true
    mode: rr_ratio  # percent | rr_ratio | fixed
    percent: null
    rr_ratio: 1.0   # 1R = one initial-risk unit = 3.0 x ATR of favorable move
    fixed_value: null
  trailing_stop:
    # Applies to the RUNNER (the portion left after the 1R scale-out).
    # Per RESEARCH.md the single best-evidenced design decision in the project.
    enabled: true
    activation: 5.0   # % profit before the trail engages
    # 20% = RISK_ON default. The literature clusters the optimum at 15-20%
    # (Dai et al. 2021 IRF; larger thresholds outperform net of costs), which
    # independently matches this repo's own ai_bottleneck_stocks
    # trailing_stop_by_phase (20% early / 15% mid). Per-regime values in
    # strategy_params. Do NOT tighten below 15% without new evidence.
    distance: 20.0
  scale_out:
    # The two-stage exit the user described, made explicit.
    #   stage 1: at +1R -> sell `first_tranche_pct`, move remaining stop to BE
    #   stage 2: runner rides the regime-scaled trailing stop
    enabled: true
    trigger_rr: 1.0
    first_tranche_pct: 50        # % of position sold at the 1R trigger
    move_stop_to_breakeven: true # the "reduce risk" half of the user's design
    # DATA-DRIVEN GUARD. 1R is ATR-scaled, so its size in percent varies
    # enormously by asset. Measured on the actual price panel:
    #   BTC 1R = +6.0% | ETH +9.3% | SOL +10.6% | SPY +1.82%
    # Without a floor, equity positions would scale out on a <2% move --
    # mechanically inflating win rate and profit factor while churning
    # turnover and cost. Do not scale out on a move smaller than this.
    min_move_pct: 3.0
    optimize_ranges:
      trigger_rr: [1.0, 1.5, 2.0]
      first_tranche_pct: [0, 33, 50, 67]  # 0 = no-scale-out CONTROL ARM
      min_move_pct: [2.0, 3.0, 5.0]

fees:
  # Template shipped crypto-exchange maker/taker (0.02/0.04%). hermes_agent
  # trades THREE venue classes with very different cost structures, so a
  # single percentage is a placeholder, not the real model. Values below are a
  # conservative blend; per-venue detail is in strategy_params.venue_costs and
  # venue-aware costing is a REQUIRED build step (see build_requirements).
  maker: 0.25      # percentage
  taker: 0.35      # percentage
  slippage: 0.10   # percentage

execution:
  # The live bus already emits limit entries at retest levels
  # (see Data/bus_snapshots/crypto_squeeze_report.json paper_orders).
  entry_type: limit   # market | limit
  exit_type: market   # stops must fill as market
  partial_exits: true # required by the 1R scale-out design above

time:
  # Price panel coverage: Data/btc_historical_data.csv.
  # The ML feature set only starts 2025-05-08 (325 rows) -- RESEARCH.md
  # recommends regenerating features back to this date before any IS/OOS split.
  start_date: "2024-07-23"
  end_date: null       # null = latest available
  trading_hours: null  # mixed equity (5d/wk) + crypto (7d/wk) panel

# Prop Firm Challenge Rules
prop_firm:
  # Confirmed personal account at /cbt:discover. The separate prop-firm
  # challenge pool is out of scope for hermes_agent -- it is already covered
  # by strategies/crypto_algo_trading (prop_firm.enabled: true there).
  enabled: false
  phase: 1
  max_drawdown_percent: 10.0
  daily_loss_percent: 5.0
  phase1_target_percent: 10.0
  phase2_target_percent: 5.0
  breach_action: halt

# Strategy-specific parameters
# Seeded here from RESEARCH.md rather than left for /cbt:build, because these
# encode decisions already made and evidenced. Grid ranges are pre-registered
# BEFORE any sweep runs, matching this repo's convention in
# strategies/four_sleeve_portfolio/RESEARCH.md.
strategy_params:

  # --- Exit: regime-scaled trailing stop (the chosen, best-evidenced design)
  trailing_stop_by_regime:
    RISK_ON: 20.0   # widest -- let winners run
    MIXED: 18.0
    CAUTION: 16.0
    RISK_OFF: 15.0  # floor of the evidenced 15-20% band; do not go tighter
    optimize_range: [15.0, 17.5, 20.0]

  # --- Entry: confluence gate. Threshold deliberately NOT pre-committed.
  # The user's discovery answer was "find it empirically in research", and
  # RESEARCH.md kept it open. These are the candidate forms to grid-search.
  entry_gate:
    mode: composite_threshold  # composite_threshold | all_subscores | regime_gated
    composite_threshold: null  # UNSET -- resolved by grid search at /cbt:optimize
    min_risk_reward: 1.8       # matches RR observed in live bus setups
    optimize_ranges:
      composite_threshold: [6.5, 7.0, 7.5, 8.0]
      min_subscore_floor: [5, 6, 7]     # for all_subscores mode
      min_risk_reward: [1.5, 1.8, 2.1]

  # --- Regime engine (mechanism #2 -- the best-supported edge candidate)
  # Start from macro_sector_dominance's regime_score_model rather than
  # reinventing. Use a DYNAMIC percentile threshold for vol clustering, not a
  # fixed cutoff (RESEARCH.md feature idea, vectorbt worked example).
  regime:
    source_template: strategies/macro_sector_dominance  # regime_score_model
    vol_cluster_threshold: percentile  # percentile | fixed
    vol_lookback_days: 30
    vol_percentile: 0.75
    optimize_ranges:
      vol_lookback_days: [20, 30, 60]
      vol_percentile: [0.65, 0.75, 0.85]

  # --- Feature handling (EDA.md finding: false breadth)
  # 80 feature pairs correlate >0.9, several EXACTLY 1.0 -- the four spot-BTC-
  # ETF return/flow/vol groups are literal duplicates. Collapsing them is
  # mandatory before any confluence scoring, or the composite quadruple-counts
  # one signal and calls it agreement.
  feature_dedup:
    enabled: true
    method: representative  # representative | pca | mean_composite
    collapse_groups:
      etf_returns: [IBIT_return_1d, FBTC_return_1d, ARKB_return_1d, BITB_return_1d]
      etf_flows: [IBIT_flow_proxy, FBTC_flow_proxy, ARKB_flow_proxy, BITB_flow_proxy]
      etf_vol: [IBIT_vol, FBTC_vol, ARKB_vol, BITB_vol]
      volume_proxies: [btc_volume, total_volume, oi_proxy]

  # --- BTC ML ensemble: DROP CANDIDATE, not a default component
  # Its own report: 0.48 directional accuracy / 0.46 AUC (coin-flip). EDA
  # found max |feature-target corr| = 0.13 across all 42 columns. Include only
  # if ablation shows it beats the mechanical core. RESEARCH.md open q #3.
  btc_ml_ensemble:
    enabled: false
    status: drop_candidate_pending_ablation

  # --- Per-venue cost model (top-level `fees` is a blended placeholder)
  venue_costs:
    merrill_ira:   {asset: equity, commission_usd: 0.0,  slippage_bps: 5}
    fidelity:      {asset: equity, commission_usd: 0.0,  slippage_bps: 5}
    coinbase_spot: {asset: crypto, taker_pct: 0.60,      slippage_bps: 10}
    hyperliquid:   {asset: perp,   taker_pct: 0.035,     slippage_bps: 5}

  # --- Metrics & validation policy (carried forward from state.yaml)
  metrics_policy:
    headline_metric: deflated_sharpe  # Bailey & Lopez de Prado -- state trial count
    ablation_baseline: static_allocation_and_mechanical_core  # NOT just buy-and-hold
    llm_layer: forward_paper_only     # quarantined: training-cutoff leakage is
                                      # unfixable by data plumbing
    cost_model: per_trade_dollar_cost

  # --- Optimizer objective (user instruction at /cbt:config round 2)
  # Stated goal: "highest profit factor and maximizing overall returns".
  #
  # ⚠ THESE TWO CONFLICT, and this repo has already measured the tradeoff.
  # trading/hedgefund/REPORT.md, scale-in variant vs baseline:
  #     profit factor  1.74 -> 3.65   (+110%)
  #     CAGR          30.5% -> 19.3%  (-11.2pp)
  #     max drawdown -21.2% -> -11.4% (+9.8pp better)
  # Booking partial profit early raises PF and cuts drawdown by making losses
  # small, and costs return by shrinking participation in the best runners.
  # A single config cannot maximize both -- so PF is treated as the objective
  # and CAGR as a reported constraint, rather than pretending both are met.
  optimizer_objective:
    maximize: profit_factor
    subject_to:
      - "deflated_sharpe significant at p<0.05 given the full trial count"
      - "MAR >= mechanical-core baseline (no PF gain bought with drawdown)"
      - "CAGR reported alongside, never suppressed -- the tradeoff must stay visible"
    report_always: [profit_factor, cagr, max_drawdown, mar, deflated_sharpe, expectancy, turnover]
    # The no-scale-out control arm (first_tranche_pct: 0) exists so the PF gain
    # from scaling out is MEASURED against not doing it, not assumed.

  # --- Build-order requirements (RESEARCH.md recommendation #1)
  # DISCOVERY.md's plan built the confluence score BEFORE the regime engine.
  # Research inverted this: the regime + trailing-stop core has the evidence,
  # so it is the baseline everything else must beat.
  build_requirements:
    - "Build regime + trailing-stop core FIRST as a standalone costed baseline"
    - "Implement venue-aware per-trade dollar costing (not percentage-of-portfolio)"
    - "Enforce min_position_value_usd as a SKIP, never a scale-down"
    - "Deduplicate collinear features before any confluence scoring"
    - "Report Deflated Sharpe with trial count for anything grid-searched"

# Notification channels (populated by /cbt:live)
notifications:
  discord:
    enabled: false
    webhook_url: null  # Set in .env as DISCORD_WEBHOOK_URL
  telegram:
    enabled: false
    bot_token: null    # Set in .env as TELEGRAM_BOT_TOKEN
    chat_id: null      # Set in .env as TELEGRAM_CHAT_ID
  sms:
    enabled: false
    provider: twilio
    # Credentials set in .env: TWILIO_SID, TWILIO_TOKEN, TWILIO_FROM, TWILIO_TO
  email:
    enabled: false
    smtp_host: null
    smtp_port: 587
    # Credentials set in .env: EMAIL_USER, EMAIL_PASS, EMAIL_TO

# Live trading configuration (populated by /cbt:live)
live:
  exchange: null       # bybit | kraken | binance | hyperliquid
  mode: paper          # paper | live -- Alpaca sandbox only until validated
  api_key: null        # Set in .env as EXCHANGE_API_KEY
  api_secret: null     # Set in .env as EXCHANGE_API_SECRET
  subaccount: null
  max_position_size: null
  kill_switch: true
  kill_switch_drawdown: 10.0  # % drawdown to trigger kill switch

# ---------------------------------------------------------------------------
# What changed from the CBT template, and why
# ---------------------------------------------------------------------------
# | Setting            | Template   | Now         | Driver                    |
# |--------------------|------------|-------------|---------------------------|
# | initial_capital    | 10,000     | 80,000      | 4 accounts reconciled     |
# | percent_per_trade  | 2.0        | 8.0         | 6% deployed isn't an alloc|
# | max_positions      | 3          | 10          | between conflicting evid. |
# | min_position_value | (none)     | $1,000      | capacity guard (retained) |
# | regime_gross_exp   | (none)     | 80/50/25/0  | cash as regime residual   |
# | leverage           | 5x/20x on  | disabled    | benefit is DD reduction   |
# | stop_loss          | 1.0% flat  | 3.0x ATR    | repo's validated default  |
# | take_profit        | 2.0% full  | 1R PARTIAL  | user's scale-out design   |
# | scale_out          | (none)     | 50% @ 1R    | "reduce risk, then trail" |
# | trailing_stop      | disabled   | ENABLED 20% | best-evidenced exit       |
# | partial_exits      | false      | true        | required by scale-out     |
# | fees               | 0.02/0.04  | 0.25/0.35   | retail multi-venue reality|
# | entry_type         | market     | limit       | live bus emits limits     |
# | start_date         | null       | 2024-07-23  | actual data coverage      |
# | strategy_params    | {}         | populated   | research-driven decisions |
#
# Two settings deserve specific mention.
#
# 1. The template's stop_loss 1.0% / take_profit 2.0% pairing: a 1% stop on
#    daily crypto data whose std is 2.89% (EDA.md) would be hit by ordinary
#    noise almost every session. Left unchanged it would have produced a
#    backtest measuring nothing but stop-out frequency.
#
# 2. take_profit reversed direction between /cbt:config rounds 1 and 2. Round
#    1 disabled it (a full fixed target caps the trailing mechanism's tail --
#    still true). Round 2 enabled it as a PARTIAL 1R scale-out per the user's
#    design, which books risk without capping the runner. The distinction
#    between a full and a partial target is the whole reason both calls are
#    consistent.
