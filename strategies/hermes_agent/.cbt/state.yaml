  - id: R8
    claim: "Optimal concentration lies between the repo's two conflicting findings (top-4 vs top-12)"
    source: "four_sleeve OPTIMIZATION_REPORT (top4>top6) vs hedgefund REPORT (top12>8>5)"
    note: "default 10 is a placeholder, NOT a determination -- grid [5,7,10,12] resolves it"
  # --- verdicts recorded at the step-5 baseline run (2026-08-27) ---
  # R1  NOT RESOLVED. Regime arm beats static on MAR directionally (0.023 vs
  #     0.013) but on 54 entries over 1.29 tradeable years the gap is
