# Build process tracking
# Order INVERTED from DISCOVERY.md's original 8-step plan per RESEARCH.md
# recommendation #1: the regime + exit core is built first as a fully-costed
# baseline, so the baseline run lands at step 5 rather than step 9 and every
# later layer must beat it. See BUILD_PLAN.md.
build:
  plan:
    - data_pipeline          # 1  Polars, calendar join, contiguous arrays
    - regime_engine          # 2  dynamic percentile vol, gross exposure
    - exit_engine            # 3  ATR stop -> 1R scale-out -> regime trail
    - backtest_runner        # 4  Numba, venue costs, position floor as SKIP
    - baseline_run           # 5  <-- THE BAR: mechanical core, no features
    - feature_pipeline       # 6  load + mandatory dedup of collinear groups
    - confluence_layer       # 7  F/T/S/M extraction, must beat step 5
    - ablation_walkforward   # 8  pre-registered grids, Deflated Sharpe
    - btc_ml_ensemble        # 9  CONDITIONAL - currently a drop candidate
  current_step: baseline_run
  progress: "5/9"
  steps_built: [data_pipeline, regime_engine, exit_engine, backtest_runner, baseline_run]
  steps_blocked: [feature_pipeline, confluence_layer, ablation_walkforward, btc_ml_ensemble]
  gate_result: FAIL
  gate_detail: >-
    Arm A (regime-scaled) beat the static-80% arm on MAR (0.023 vs 0.013) but
    lost to buy-and-hold BTC on CAGR (0.35% vs 9.03%). BUILD_PLAN.md requires
    beating BOTH. Steps 6-9 deliberately NOT built -- see BASELINE_REPORT.md.
  invariants: all_passing   # position floor, exposure cap, cost direction, determinism
  gate: "If step 5 fails to beat BOTH buy-and-hold AND a static allocation, stop and report -- do not build steps 6-9 on a core that does not work"

