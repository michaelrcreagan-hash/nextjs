    claim: "min_move_pct floor of 3% prevents the 1R scale-out from churning equities"
    source: "measured on price panel: 1R = BTC 6.0% / ETH 9.3% / SOL 10.6% / SPY only 1.82%"
    note: "without it, SPY-like names book a 'win' on <2% moves, inflating PF via turnover"

