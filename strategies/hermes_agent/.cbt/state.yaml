  headline_metric: deflated_sharpe   # Bailey & Lopez de Prado - report trial count
  ablation_baseline: static_allocation_and_mechanical_core  # not just buy-and-hold
  llm_layer: forward_paper_only      # quarantined from backtested claims (training-cutoff leakage)
  cost_model: per_trade_dollar_cost  # not percentage-of-portfolio abstraction
  optimizer_objective: profit_factor # user instruction; gated by DSR significance + MAR floor

